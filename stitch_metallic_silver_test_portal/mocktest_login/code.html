<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MOCKTEST | Login</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Work Sans -->
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "surface-container-high": "#e8e8e8",
                "surface-dim": "#dadada",
                "surface": "#f9f9f9",
                "surface-container-lowest": "#ffffff",
                "surface-container-highest": "#e2e2e2",
                "on-primary-container": "#848484",
                "on-primary-fixed-variant": "#474747",
                "tertiary-fixed-dim": "#c6c6c6",
                "on-secondary-fixed": "#1a1c1c",
                "surface-tint": "#5e5e5e",
                "on-tertiary-fixed": "#1b1b1b",
                "on-primary": "#ffffff",
                "secondary": "#5e5e5f",
                "on-surface-variant": "#4c4546",
                "on-secondary-container": "#626363",
                "tertiary": "#000000",
                "tertiary-fixed": "#e2e2e2",
                "secondary-container": "#e0dfdf",
                "primary-container": "#1b1b1b",
                "on-tertiary-container": "#848484",
                "on-tertiary": "#ffffff",
                "inverse-surface": "#303030",
                "error": "#ba1a1a",
                "secondary-fixed": "#e3e2e2",
                "outline-variant": "#cfc4c5",
                "outline": "#7e7576",
                "on-tertiary-fixed-variant": "#474747",
                "surface-container-low": "#f3f3f3",
                "primary-fixed": "#e2e2e2",
                "on-error": "#ffffff",
                "secondary-fixed-dim": "#c7c6c6",
                "primary": "#000000",
                "on-secondary-fixed-variant": "#464747",
                "on-primary-fixed": "#1b1b1b",
                "on-background": "#1b1b1b",
                "on-secondary": "#ffffff",
                "error-container": "#ffdad6",
                "tertiary-container": "#1b1b1b",
                "inverse-primary": "#c6c6c6",
                "primary-fixed-dim": "#c6c6c6",
                "on-surface": "#1b1b1b",
                "on-error-container": "#93000a",
                "surface-variant": "#e2e2e2",
                "surface-container": "#eeeeee",
                "inverse-on-surface": "#f1f1f1",
                "background": "#f9f9f9",
                "surface-bright": "#f9f9f9"
            },
            "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
            },
            "spacing": {
                "unit": "8px",
                "container-margin": "24px",
                "xs": "4px",
                "lg": "24px",
                "sm": "8px",
                "md": "16px",
                "gutter": "16px",
                "xl": "32px"
            },
            "fontFamily": {
                "ui-header": ["Work Sans"],
                "sub-header": ["Work Sans"],
                "page-title": ["Work Sans"],
                "body": ["Work Sans"],
                "body-bold": ["Work Sans"]
            },
            "fontSize": {
                "ui-header": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                "sub-header": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                "page-title": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                "body": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "body-bold": ["14px", {"lineHeight": "20px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        /* Custom smooth transition for focus states */
        input:focus {
            outline: none;
            box-shadow: none;
        }

        .login-card {
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.05);
        }

        /* Subtle metallic animation for the background shader */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #ffffff;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface flex items-center justify-center min-h-screen relative overflow-hidden">
<!-- Background Asset (Atmospheric Layering) -->
<div class="bg-mesh">
<!-- Using a hypothetical shader for the "authoritative, scholarly" vibe -->
<!-- In the absence of a specific placeholder for this login screen, we use a clean CSS gradient setup that aligns with Style Guidance -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 24px 24px;"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[400px] px-container-margin z-10">
<!-- Brand Identity -->
<div class="text-center mb-xl">
<h1 class="font-page-title text-page-title font-black text-primary tracking-tighter mb-xs">MOCKTEST</h1>
<p class="font-body text-secondary uppercase tracking-[0.2em] text-[10px]">Authoritative Practice</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest border border-surface-variant p-xl rounded-none">
<div class="mb-lg">
<h2 class="font-sub-header text-sub-header text-primary">Log In</h2>
<p class="font-body text-secondary mt-xs">Access your testing portal</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-body-bold text-on-surface text-xs uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-variant px-md py-md font-body text-on-surface transition-all focus:border-primary rounded-none" id="email" name="email" placeholder="name@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-body-bold text-on-surface text-xs uppercase tracking-wider" for="password">Password</label>
<a class="font-body text-secondary hover:text-primary transition-colors text-xs underline underline-offset-4" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-surface-variant px-md py-md font-body text-on-surface transition-all focus:border-primary rounded-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-body-bold py-md uppercase tracking-[0.1em] hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-md" type="submit">
                    Log In
                </button>
</form>
<!-- Secondary Action -->
<div class="mt-xl pt-lg border-t border-surface-variant text-center">
<p class="font-body text-secondary mb-sm">New to the platform?</p>
<a class="inline-block font-body-bold text-primary border-b border-primary pb-xs hover:text-secondary hover:border-secondary transition-colors" href="#">
                    Create an Account
                </a>
</div>
</div>
<!-- Trust Footer (Minimal) -->
<div class="mt-xl text-center space-y-md">
<div class="flex justify-center gap-md">
<div class="h-10 w-10 grayscale opacity-20 border border-surface-variant flex items-center justify-center p-xs">
<span class="material-symbols-outlined text-lg">verified_user</span>
</div>
<div class="h-10 w-10 grayscale opacity-20 border border-surface-variant flex items-center justify-center p-xs">
<span class="material-symbols-outlined text-lg">shield</span>
</div>
<div class="h-10 w-10 grayscale opacity-20 border border-surface-variant flex items-center justify-center p-xs">
<span class="material-symbols-outlined text-lg">lock</span>
</div>
</div>
<p class="text-[10px] font-body text-secondary-fixed-dim uppercase tracking-widest">
                Secure Scholar Environment © 2024
            </p>
</div>
</main>
<!-- Decorative Illustration Side (Conceptual/Abstract) -->
<div class="hidden lg:block absolute right-[-10%] top-[-10%] w-[50%] h-[120%] opacity-[0.02] pointer-events-none rotate-12">
<div class="w-full h-full border-[1px] border-primary flex items-center justify-center">
<div class="w-[80%] h-[80%] border-[1px] border-primary flex items-center justify-center">
<div class="w-[80%] h-[80%] border-[1px] border-primary"></div>
</div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            const submitBtn = document.querySelector('button[type="submit"]');

            inputs.forEach(input => {
                // Visual feedback on focus
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.querySelector('label').style.color = '#000000';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.querySelector('label').style.color = '';
                });
            });

            // Form submission feedback simulation
            const form = document.querySelector('form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
                submitBtn.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    submitBtn.innerHTML = 'Authenticated';
                    submitBtn.classList.replace('bg-primary', 'bg-tertiary-fixed-dim');
                    submitBtn.classList.replace('text-on-primary', 'text-primary');
                }, 1500);
            });
        });
    </script>
</body></html>
